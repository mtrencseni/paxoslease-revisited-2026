\* The unqualified own-lease-open rule under explicit retry: p1 abandons an
\* attempt with its accept requests still in flight; p2 acquires under a
\* lower ballot after acceptor crash, restart, and the FULL quarantine; the
\* stale accepts overwrite p2's records; p1's fresh attempt sees "its own"
\* lease reported, counts the responses open, and activates while p2 is
\* still active.  36-state two-owner trace, multi-hour search
\* (`make counterexamples-staleowner`, recorded in
\* results/counterexample-staleowneropen.txt).
SPECIFICATION Spec
CONSTANTS
    Proposers = {p1, p2}
    Acceptors = {a1, a2}
    Ballots = {1, 2, 3}
    NoOwner = NoOwner
    MaxTime = 2
    ProposerDuration = 2
    AcceptorDuration = 2
    Quarantine = 2
    AllowCrash = TRUE
    AllowRelease = FALSE
    AllowDrop = FALSE
    AllowRenewal = FALSE
    AllowAbandon = TRUE
    AllowRedeliver = FALSE
    CrashDropsIncoming = TRUE
    RefuseLiveOverwrite = FALSE
    MaxNetwork = 4
INVARIANT TypeOK
INVARIANT LeaseExclusivity
CONSTRAINT StateConstraint
